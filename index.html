<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daily Closest to the Pin Challenge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #0a2612; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    html { overflow-y: scroll; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(250,204,21,0.5); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(250,204,21,0.7); }
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; text-align: center; background: rgba(0,0,0,0.25); }
    header h1 { margin: 0; font-size: 20px; color: #facc15; letter-spacing: 1px; }
    header .sub { font-size: 13px; color: #facc15; font-weight: bold; margin-top: 2px; }
    header .date { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 2px; }

    #game-wrap { position: relative; display: flex; justify-content: center; padding: 0; }
    #game {
      width: 100%; height: calc(100vh - 52px);
      border: 0; border-radius: 0; box-shadow: none;
      background: #111;
    }
    #scroll-bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 44px; z-index: 10;
      background: linear-gradient(to right, rgba(0,0,0,0.55), rgba(0,0,0,0.25));
      border-right: 1px solid rgba(250,204,21,0.45);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 0; cursor: grab; touch-action: none;
    }
    #scroll-bar.active { background: linear-gradient(to right, rgba(250,204,21,0.3), rgba(250,204,21,0.1)); }
    .scroll-arrow { color: #facc15; font-size: 18px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.9); padding: 2px 0; }
    #scroll-track { flex: 1; width: 6px; background: rgba(250,204,21,0.15); border-radius: 3px; position: relative; margin: 4px 0; }
    #scroll-thumb { position: absolute; left: -5px; width: 16px; height: 50px; background: rgba(250,204,21,0.8); border-radius: 8px; top: 0; }
    #lb-scroll-btn-wrap { display: flex; justify-content: center; padding: 12px 0; }
    #lb-scroll-btn {
      padding: 10px 28px; border: 1px solid rgba(250,204,21,0.4); border-radius: 999px;
      background: rgba(250,204,21,0.1); color: #facc15; font-weight: bold; font-size: 14px; cursor: pointer;
    }

    #leaderboard { padding: 12px 16px 48px; }
    .lb-tab { display: flex; gap: 8px; margin-bottom: 12px; }
    .lb-tab button {
      flex: 1; padding: 9px; border: 0; border-radius: 8px;
      background: rgba(255,255,255,0.08); color: #fff; font-weight: bold; cursor: pointer;
    }
    .lb-tab button.active { background: #facc15; color: #0a2612; }
    .lb-row {
      display: flex; align-items: center; gap: 10px; padding: 9px 11px;
      border-radius: 8px; background: rgba(255,255,255,0.05); margin-bottom: 6px;
    }
    .lb-row.me { background: rgba(250,204,21,0.18); border: 1px solid #facc15; }
    .lb-rank { width: 30px; font-weight: bold; color: #facc15; }
    .lb-name { flex: 1; font-weight: 600; }
    .lb-dist { font-weight: bold; }
    .lb-ace { font-size: 11px; background: #facc15; color: #0a2612; padding: 1px 6px; border-radius: 999px; margin-left: 6px; }
    .hint { font-size: 12px; color: rgba(255,255,255,0.45); }
    .login-btn {
      margin: 8px 0; padding: 13px; width: 100%; border: 0; border-radius: 10px;
      background: #facc15; color: #0a2612; font-weight: 800; font-size: 15px; cursor: pointer;
    }

    #overlay { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
    .result-overlay {
      position: absolute; inset: 0; background: rgba(10,38,18,0.97);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; pointer-events: auto; overflow-y: auto;
    }
    .result-overlay h2 { font-size: 24px; color: #facc15; margin: 0 0 12px; }
    .result-stats { display: flex; gap: 28px; margin-bottom: 18px; }
    .result-stats .big { font-size: 38px; font-weight: 800; color: #facc15; }
    .result-stats .lbl { font-size: 11px; color: rgba(255,255,255,0.6); }
    .share-btn {
      margin: 6px 0; padding: 13px 24px; border: 0; border-radius: 10px;
      background: #facc15; color: #0a2612; font-weight: 800; cursor: pointer; width: 100%; max-width: 300px;
    }
    .replay-btn {
      margin-top: 8px; padding: 11px 20px; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px; background: transparent; color: #fff; font-weight: bold; cursor: pointer;
    }
    .replay-warn { font-size: 12px; color: rgba(255,255,255,0.75); margin: 8px 0; line-height: 1.4; max-width: 300px; }

    .tagme { margin-top: 20px; max-width: 320px; width: 100%; }
    .tagme h3 { font-size: 16px; color: #facc15; margin: 0 0 4px; }
    .tagme-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin: 0 0 10px; line-height: 1.4; }
    .tagme-inputs { display: flex; flex-direction: column; gap: 8px; }
    .tagme-inputs input { padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; outline: none; }
    .tagme-inputs input:focus { border-color: #facc15; }
    .tagme-btn { margin-top: 10px; padding: 11px; border: 1px solid #facc15; border-radius: 8px; background: rgba(250,204,21,0.15); color: #facc15; font-weight: bold; cursor: pointer; }
    .tagme-btn:disabled { opacity: 0.6; cursor: default; }
    .tagme-saved { font-size: 12px; color: #4ade80; margin-top: 8px; }

    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a2612; z-index: 100; }
    #boot .spin { width: 34px; height: 34px; border: 4px solid #facc15; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="spin"></div></div>
  <div id="app" style="display:none">
    <header>
      <h1 id="heading">Daily Closest to the Pin Challenge</h1>
      <div class="sub" id="subtitle" style="display:none"></div>
      <div class="date" id="date-label"></div>
    </header>
    <div id="game-wrap">
      <iframe id="game" title="Par 3 Challenge"></iframe>
      <div id="scroll-bar">
        <span class="scroll-arrow">↑</span>
        <div id="scroll-track"><div id="scroll-thumb"></div></div>
        <span class="scroll-arrow">↓</span>
      </div>
    </div>
    <div id="lb-scroll-btn-wrap">
      <button id="lb-scroll-btn">Leaderboard ↓</button>
    </div>
    <div id="leaderboard"></div>
  </div>
  <div id="overlay"></div>
  <script>
  (function() {
    var bar = document.getElementById('scroll-bar');
    if (!bar) return;
    var isScrolling = false, startY = 0, startScroll = 0;
    function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }
    function start(e) {
      isScrolling = true; startY = getY(e); startScroll = window.scrollY;
      bar.classList.add('active');
      if (e.cancelable) e.preventDefault(); e.stopPropagation();
    }
    function move(e) {
      if (!isScrolling) return;
      if (e.cancelable) e.preventDefault(); e.stopPropagation();
      window.scrollTo(0, Math.max(0, startScroll - (getY(e) - startY)));
    }
    function end() { if (!isScrolling) return; isScrolling = false; bar.classList.remove('active'); }
    bar.addEventListener('touchstart', start, { passive: false });
    bar.addEventListener('touchmove', move, { passive: false });
    bar.addEventListener('touchend', end);
    bar.addEventListener('touchcancel', end);
    bar.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    var thumb = document.getElementById('scroll-thumb');
    var track = document.getElementById('scroll-track');
    function updateThumb() {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      if (max <= 0 || !track || !thumb) return;
      var ratio = window.scrollY / max;
      thumb.style.top = (ratio * (track.offsetHeight - thumb.offsetHeight)) + 'px';
    }
    window.addEventListener('scroll', updateThumb);
    window.addEventListener('resize', updateThumb);
    window.addEventListener('load', updateThumb);
    setTimeout(updateThumb, 1000);
  })();
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
